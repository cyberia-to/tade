[package]
name = "cyber-tape"
version = "0.1.0"
edition = "2024"
description = "TAPE — Typed Annotated Payload Exchange. A typed framed byte-stream protocol."
license-file = "LICENSE"
repository = "https://github.com/cyberia-to/tape"
readme = "README.md"
keywords = ["protocol", "framing", "tape", "cyber"]
categories = ["network-programming", "encoding"]

[lib]
name = "tape"
path = "src/lib.rs"

[dependencies]
bytes = "1"

[[bin]]
name = "tape"
path = "src/bin/tape.rs"

[package]
name = "tade"
version = "0.1.0"
edition = "2024"
description = "TADE — Typed Annotated Data Exchange. A typed framed byte-stream protocol."
license-file = "LICENSE"
repository = "https://github.com/cyberia-to/tade"
readme = "README.md"
keywords = ["protocol", "framing", "tade", "cyber"]
categories = ["network-programming", "encoding"]

[lib]
name = "tade"
path = "src/lib.rs"

[dependencies]
bytes = "1"

[[bin]]
name = "tade"
path = "src/bin/tade.rs"
